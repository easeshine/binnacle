packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

catalog:
  '@changesets/cli': ^3.0.3
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@content-collections/cli': ^0.1.9
  '@content-collections/core': ^0.15.3
  '@content-collections/markdown': ^0.1.4
  '@content-collections/vite': ^0.3.1
  '@tailwindcss/typography': ^0.5.20
  '@types/node': ^24
  semver: 7.8.5
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  zod: ^4.6.7

catalogMode: prefer

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

resolvePeersFromWorkspaceRoot: false
