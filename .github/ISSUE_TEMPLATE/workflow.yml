name: Workflow
description: An agent's skill, script or setup slowed a change, or let a mistake through. It is not a problem of binnacle.
labels: [workflow]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The Task or the fix, the step of the skill, and what it cost or let through.
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: What is wanted
      description: The change to the skill, the script or the setup, and the files it touches.
    validations:
      required: true
