# The binnacle bundle, stacked by a profile over dsh-base.
# The agent is composed as dsh's headless bundle composes it: its persona and its tools mode.
- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# Hot reload stays off until the core stays up while its plugins reload.
- id: hmr
  disabled: true

- insert:
    # The core: it owns the terminal, and provides the binnacle service.
    - id: binnacle
      name: '@easeshine/binnacle'
    # The transcript: the session's events, raw.
    - id: binnacle-transcript
      name: '@easeshine/binnacle/plugins/transcript'
    # The transcript's view: what a person reads, each piece a Look. Off, the transcript draws each event raw.
    - id: binnacle-transcript-view
      name: '@easeshine/binnacle/plugins/transcript-view'
    # The notice of a new version: once for each, above the transcript's first event. Off, binnacle asks npm nothing.
    - id: binnacle-notice
      name: '@easeshine/binnacle/plugins/notice'
    # The tool cards: each tool call and its result as one card, drawn from the views dsh's tools give. Off, the view draws a call and its result as two lines.
    - id: binnacle-tool-cards
      name: '@easeshine/binnacle/plugins/tool-cards'
    # The composer: what a person types, before it is sent.
    - id: binnacle-composer
      name: '@easeshine/binnacle/plugins/composer'
    # The offer of commands: typing / offers dsh's commands above the composer. Off, a command typed in full still runs.
    - id: binnacle-commands
      name: '@easeshine/binnacle/plugins/commands'
    # Copying: a release after a drag copies the Selection to the clipboard. Off, a drag still selects, and copies nothing.
    - id: binnacle-copy
      name: '@easeshine/binnacle/plugins/copy'
    # The palettes: /palette opens a List of palettes above the composer, from pi's themes and an author's sources. Off, palette.json still applies, and a palette of pi's draws as the terminal's colours.
    - id: binnacle-palette
      name: '@easeshine/binnacle/plugins/palette'
    # The status line: whether the agent runs, on which model, and how a copy ended.
    - id: binnacle-status-line
      name: '@easeshine/binnacle/plugins/status-line'
    # The Requests: the approvals and the questions that stand, and the talk with dsh. It draws nothing.
    - id: binnacle-requests
      name: '@easeshine/binnacle/plugins/requests'
    # The Requests' default view: a tool asks for an approval, or the agent asks a question, and a person answers.
    - id: binnacle-requests-view
      name: '@easeshine/binnacle/plugins/requests-view'
    # binnacle's skill: the Chat's agent has it in its catalog, and loads it to change binnacle's colours, keys, layout or features. Off, the agent does not know binnacle.
    - id: binnacle-skill
      name: '@easeshine/binnacle/plugins/skill'
    # The tool the agent asks through, in its blocking mode, as dsh's standard preset composes it.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
